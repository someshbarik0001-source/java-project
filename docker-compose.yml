version: '3.8'

services:
  java-backend:
    build:
      context: .
      dockerfile: Dockerfile.java
    container_name: learnx-java-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learnx-frontend
    ports:
      - "3000:7860"
    environment:
      - JAVA_BACKEND_URL=http://java-backend:8080
      - NEXT_PUBLIC_JAVA_BACKEND_URL=http://localhost:8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - java-backend
    restart: unless-stopped
